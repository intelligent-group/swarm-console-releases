name: QA Gate 18 - Gitleaks Secret Scan

# Scans every commit + every PR for hardcoded credentials (API keys, tokens,
# private keys, connection strings) using gitleaks. Hard gate: any leak
# detected fails the PR.
#
# This repo is PUBLIC: the org's self-hosted runner group has
# allows_public_repositories=false (GitHub blocks self-hosted runners on
# public repos by design, to stop an untrusted fork PR from running arbitrary
# code on our own hardware) -- a job requesting [self-hosted,
# mroot-self-hosted] here queues forever with no runner ever picking it up.
# ubuntu-latest is used instead, which is free/unlimited on public repos, so
# this is not a billable-cost decision.
#
# The weekly full-history sweep (schedule trigger below) was armed 2026-10-21.

# SCOPE (2026-10-21): checkout fetch-depth: 0 fetches EVERY remote branch, and a bare `gitleaks detect` walks
# `git log --all`, so a secret-shaped fixture on any one open branch turned this required check red on EVERY PR.
# PR runs now scan only their own commit range (see the scan step); push/dispatch scan the history reachable
# from HEAD; the weekly cron below is the deliberate all-refs full-history sweep (blocking on its own schedule).
# Same fix as intelligent-group/ait-crm#4500.

on:
  schedule:
    - cron: '15 11 * * 1'  # Mon 7:15am ET weekly all-refs full-history sweep
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan for hardcoded secrets
    # runner-policy-ok: PUBLIC repo -- the org's only runner group ("Default")
    # has allows_public_repositories=false, so GitHub will never assign a
    # self-hosted runner to this job regardless of labels; it just queues
    # forever. See the header comment above for the full rationale. The
    # marker is required (not just the prose above) because
    # scripts/gha-drift-heal.sh only recognizes MARKER_RE on the runs-on
    # line itself or on a comment block immediately preceding it -- a prose
    # rationale separated by other YAML keys is invisible to it, which is
    # how PR #6 reverted this line on 2026-10-19.
    runs-on: ubuntu-latest  # runner-policy-ok: self-hosted cannot run on a public repo
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # NOT the shared gha-lib action: intelligent-group/gha-lib is PRIVATE and GitHub
      # cannot resolve a private repo's action from a PUBLIC repo ("Unable to resolve
      # action ... not found"). Same logic as gha-lib/actions/gitleaks-scan (pinned
      # version, release checksum verified, hard gate, redacted) inlined here
      # (ait-claude-config#13059).
      - name: Install gitleaks CLI (pinned, checksum verified)
        run: |
          set -euo pipefail
          GL_VERSION="8.27.0"
          dir="$RUNNER_TEMP/ig-gitleaks"
          mkdir -p "$dir"
          tgz="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}"
          curl -sSfL --retry 6 --retry-delay 5 --retry-all-errors -o "$dir/$tgz" "$base/$tgz"
          curl -sSfL --retry 6 --retry-delay 5 --retry-all-errors -o "$dir/checksums.txt" "$base/gitleaks_${GL_VERSION}_checksums.txt"
          want=$(awk -v f="$tgz" '$2 == f {print $1}' "$dir/checksums.txt")
          got=$(sha256sum "$dir/$tgz" | awk '{print $1}')
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::gitleaks checksum missing or mismatch for $tgz"
            exit 1
          fi
          tar -xzf "$dir/$tgz" -C "$dir" gitleaks
          "$dir/gitleaks" version

      - name: Run gitleaks (hard gate)
        # PR: scan only this PR's net change (one synthetic commit: HEAD's tree on top of origin/<base>, built with
        # commit-tree so HEAD/index are untouched). push/dispatch: history reachable from HEAD. schedule: all refs.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
              NET="$(GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.invalid GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.invalid \
                git commit-tree 'HEAD^{tree}' -p "origin/${BASE_REF}" -m 'net PR change')"
              RANGE="origin/${BASE_REF}..${NET}" ;;
            schedule) RANGE="" ;;
            *) RANGE="HEAD" ;;
          esac
          echo "gitleaks scope: ${RANGE:-all refs} (event=${EVENT})"
          if [ -n "$RANGE" ]; then
            "$RUNNER_TEMP/ig-gitleaks/gitleaks" detect --source . --redact --no-banner --exit-code 1 --log-opts="${RANGE}"
          else
            "$RUNNER_TEMP/ig-gitleaks/gitleaks" detect --source . --redact --no-banner --exit-code 1
          fi
